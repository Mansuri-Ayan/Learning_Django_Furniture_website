<!-- @format -->

{% extends "base.html"%} {% load static %} {% block body %}
<div class="hero">
  <div class="container">
    <div class="d-flex justify-items-between justify-content-center">
      <div class="text-center">
        <div class="intro-excerpt">
          <h1>Welcome Back</h1>
          <p class="mb-0">
            Log in to manage your orders and discover new furniture picks
            curated for you.
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="untree_co-section py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="p-4 p-lg-5 border bg-white">
          <h2 class="mb-4 text-center">Sign in to Furni</h2>
          <form action="/login/" method="post">
            {% csrf_token %}
            <div class="form-group mb-3">
              <label class="text-black" for="login-email">User Name</label>
              <input
                type="text"
                class="form-control"
                id="uname"
                name="uname"
                placeholder="Enter your Nmae"
              />
            </div>
            <div class="form-group mb-4">
              <label class="text-black" for="login-password">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Enter password"
              />
            </div>
            <div
              class="d-flex justify-content-between align-items-center mb-4 flex-wrap"
            >
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  value=""
                  id="remember"
                />
                <label class="form-check-label" for="remember">
                  Remember me
                </label>
              </div>
              <a href="#" class="small text-muted">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
              Log In
            </button>
            <p class="text-center mb-0">
              New to Furni? <a href="{% url 'signup' %}">Create an account</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock body %}
